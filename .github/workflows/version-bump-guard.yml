# Consumers install a version-pinned copy of this plugin and only re-fetch when the version
# string in .claude-plugin/plugin.json changes. So a change to skills/ that ships without a bump
# is invisible: agents keep loading the cached copy and there is no error anywhere to notice.
#
# That is not hypothetical. The version read 1.18.0 from 2026-06-27 to 2026-07-31 while skills/
# gained ~11KB, and every plugin-loading agent read five-week-old skills the whole time.
name: version-bump-guard

on:
  push:
    branches: [main]
  pull_request:

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require a version bump alongside skill changes
        env:
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          MANIFEST=.claude-plugin/plugin.json

          if [ -n "${BASE:-}" ]; then
            RANGE_START="$BASE"
          elif [ -n "${BEFORE:-}" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            RANGE_START="$BEFORE"
          else
            echo "No comparable base (first push or force-push) — skipping."
            exit 0
          fi

          if ! git cat-file -e "$RANGE_START^{commit}" 2>/dev/null; then
            echo "Base $RANGE_START is not reachable — skipping."
            exit 0
          fi

          changed=$(git diff --name-only "$RANGE_START" HEAD -- skills/ | head -20)
          if [ -z "$changed" ]; then
            echo "No skills/ changes in this range — nothing to guard."
            exit 0
          fi

          old=$(git show "$RANGE_START:$MANIFEST" 2>/dev/null | jq -r '.version // empty' || true)
          new=$(jq -r '.version // empty' "$MANIFEST")

          if [ -z "$new" ]; then
            echo "::error::$MANIFEST has no version field. Consumers cannot detect updates."
            exit 1
          fi

          if [ "$old" = "$new" ]; then
            echo "::error::skills/ changed but $MANIFEST version is still $new."
            echo ""
            echo "Consumers pin to the version string and will keep serving the cached copy."
            echo "Bump the version, or these changes reach nobody:"
            echo ""
            echo "$changed" | sed 's/^/  /'
            echo ""
            echo "  jq '.version = \"X.Y.Z\"' $MANIFEST > /tmp/p.json && mv /tmp/p.json $MANIFEST"
            exit 1
          fi

          echo "OK: skills/ changed and version moved $old -> $new."
